[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mesb-framework"
version = "0.1.0"
description = "MESB security validation framework"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "audit*",
    "models*",
    "normalizers*",
    "correlation*",
    "scoring*",
    "quality_gate*"
]